# Hosting stack. It does not use the dev server port (3000) or XAMPP MySQL (3306).
# Start only when you want the hosted copy:
#   docker compose up -d --build
# Local development stays: npm run dev  and  XAMPP MySQL on localhost:3306

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: qa_ai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-demandarm-host}
    ports:
      - "3307:3306"
    volumes:
      - demandarm_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-demandarm-host}@mysql:3306/qa_ai
      HOSTNAME: 0.0.0.0
      PORT: 3000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  demandarm_mysql:
